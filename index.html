  const avgSe = c.reduce((a, b) => a + b.se, 0) / c.length;
  const sdBed = sd(ns.map(x => rel(toMin(x.bed)))), sdWake = sd(ns.map(x => rel(toMin(x.out))));
  const minTst = Math.min(...c.map(x => x.tst)), maxTst = Math.max(...c.map(x => x.tst));
  const need = S.settings.need * 60;
  const durScore = Math.min(1, avgTst / need) * 40;
  const seScore = Math.min(1, Math.max(0, (avgSe - .6) / .3)) * 30;
  const regScore = Math.max(0, 1 - ((sdBed + sdWake) / 2) / 90) * 30;
  return { count: ns.length, avgTst, avgSe, sdBed, sdWake, minTst, maxTst, score: Math.round(durScore + seScore + regScore), caffeine: ns.filter(x => x.caffeine).length, screen: ns.filter(x => x.screen).length };
}
/* Schlaffenster: Aufstehzeit ist der Anker. Bei schlechter Effizienz wird das Fenster an die

function plan() {
  const st = stats(7), wake = toMin(S.settings.wake);
  let win = S.settings.need * 60, mode = 'normal';
  if (st && !S.settings.noRestrict && st.count >= 5 && st.avgSe < .85) { win = Math.max(360, Math.min(win, Math.round((st.avgTst + 30) / 15) * 15)); mode = 'fokus'; }

  return { win, mode, bed: fromMin(bed), wind: fromMin(bed - S.settings.windDown), wake: S.settings.wake };
}

}

<script>

(function () {
  const rm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  const SPR = 'cubic-bezier(.34,1.56,.64,1)', EASE = 'cubic-bezier(.2,.8,.2,1)';
  const dev = q('#device') || document.body;

  /* Effekt-Ebene (fixed, über allem, klickdurchlässig) + Dämmerungs-Schleier hinter dem Inhalt */
  const fx = document.createElement('div'); fx.className = 'm-fx'; fx.setAttribute('aria-hidden', 'true'); dev.appendChild(fx);
  const dusk = document.createElement('div'); dusk.className = 'm-dusk'; dusk.setAttribute('aria-hidden', 'true'); dev.insertBefore(dusk, dev.firstChild);

  /* ---------- 1. Landschaft dämmert beim Halten von „Ich gehe jetzt schlafen“ ---------- */

        { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy + 10}px)) scale(.2)`, opacity: 0 }], { duration: 520 + Math.random() * 260, easing: EASE }).onfinish = () => s.remove();
    }

  function odometer(b, from, to) {

    nb.innerHTML = `<span class="m-odo-in"><span>${from}</span><span>${to}</span></span>`; b.replaceWith(nb); // altes b fällt raus → countUp stoppt

  }

      if (was == null || v <= was) return;

      const mile = typeof MILES !== 'undefined' && MILES.includes(v), delay = 450 + k++ * 220;

        const r = pill.getBoundingClientRect(); sparks(r.left + r.width / 2, r.top + r.height / 2, mile ? 16 : 7, { cls: 'fire', dist: mile ? 34 : 22 });
        hap(mile ? [10, 30, 14] : 8);

  /* ---------- Hüllen um Kernfunktionen ---------- */
  let riseNext = false;
  if (typeof window.render === 'function') {
    const _render = window.render;
    window.render = function (quiet) {
      const r = _render.apply(this, arguments);
      try { afterRender(quiet); } catch (e) { }
      return r;
    };
  }
  function afterRender(quiet) {
    if (dimV > 0) window.Orb?.update?.({ dim: dimV });
    if (!quiet) streakFx(); else readStreaks().forEach((v, k) => prevStreak.set(k, v));
    if (riseNext) { riseNext = false; sunrise(); }

  }

<script>
'use strict';
/* Schlafanker – persönliche Gute-Nacht-Nachricht: wenn's Schlafenszeit ist und du noch am Handy hängst.
   Nutzt nur deine eigenen Daten (Uni-Plan, Wecker, Serien, Stimmung, Profil) – keine erfundenen Zahlen. */
(function () {
  const nm = () => (S.profile?.name ? S.profile.name : '');
  /* Wie spät ist es relativ zur geplanten Bettzeit? (positiv = drüber) */
  function lateness() { const p = plan(); return rel(toMin(nowHM())) - rel(toMin(p.bed)); }

  const pickV = (key, arr) => { const slot = Math.floor(Date.now() / 600000); let h = 0; for (const c of key) h = (h * 31 + c.charCodeAt(0)) | 0; return arr[Math.abs(h + slot) % arr.length]; };
  window.pickV = pickV;
  window.sleepNote = function () {
    const now = nowHM(), p = plan(), tm = typeof tomorrow === 'function' ? tomorrow() : new Date(), w = typeof wakeFor === 'function' ? wakeFor(tm) : { t: S.settings.wake };
    const left = Math.max(0, ((toMin(w.t) - toMin(now)) + 1440) % 1440 - 15), late = lateness(), out = [];
    // 1) Klartext: wie viel Schlaf noch drin ist
    const bro = (S.settings.tone || 'bro') === 'bro', mm = m => m < 60 ? m + ' Min' : dur(m);
    const head = bro ? `Bro, es ist ${now}.` : `${nm() ? nm() + ', es' : 'Es'} ist ${now}.`;
    const L = `<b>${mm(left)}</b>`;
    const sub = bro ? (left > 0 ? pickV('sub', [
        `Noch ${L} bis zum Wecker. Aber klar, das nächste Reel verändert garantiert dein Leben.`,
        `${L} Schlaf sind noch drin. Der Feed läuft dir übrigens nicht weg.`,
        `Dein Wecker klingelt in ${L}. Rate mal, wer da nicht wach wird.`,
        `Handy weg, Augen zu – dann schaffst du noch ${L}.`,
        `Noch ${L}. Wenn du jetzt pennst. Nicht in 20 Minuten.`
      ]) : `Ab ins Bett, dein Wecker klingelt um ${w.t}.`) : (left > 0 ? `Wenn du jetzt schläfst, sind noch <b>${dur(left)}</b> drin bis ${w.t}.` : `Dein Wecker klingelt um ${w.t}.`);
    // 1b) Klartext im Bro-Ton: morgen wirst du verklatscht sein
    if (bro && left > 0) out.push(['😵', left < 300 ? pickV('v1', [
        `Unter 5 Stunden Schlaf. Morgen bist du <b>komplett verklatscht</b>. Aber klar, ein Kaffee regelt das garantiert.`,
        `Morgen früh: Augenringe bis zum Kinn. Sieht bestimmt super aus in der Vorlesung.`,
        `So wird das morgen nichts. Der Zombie-Modus ist schon vorgebucht.`,
        `Weißt du, wie sich 4 Stunden Schlaf anfühlen? Morgen weißt du's.`
      ]) : left < 420 ? pickV('v2', [
        `Morgen wirst du <b>ziemlich verklatscht</b> sein. Jede Minute Scrollen macht's schlimmer.`,
        `Du kriegst das noch halbwegs hin – wenn du jetzt aufhörst. Jetzt. Nicht gleich.`,
        `Noch ein Video, und der Wecker morgen fühlt sich an wie ein Schlag ins Gesicht.`
      ]) : pickV('v3', [
        `Noch geht's. Aber jedes weitere Reel = morgen ein Stück <b>verklatschter</b>.`,
        `Gerade sieht's noch gut aus. Lass es einfach dabei.`
      ])]);
    // 2) Was morgen ansteht (Uni-Plan)
    if (w.ev) out.push(['🎓', bro ? pickV('uni', [`Morgen <b>${w.ev.start}</b> ${esc(w.ev.title)} – und du sitzt komplett verklatscht in der Vorlesung. Bestimmt hilft dir TikTok jetzt beim Verstehen. Ganz sicher.`, `<b>${w.ev.start}</b> ${esc(w.ev.title)}. Der Prof redet, du nickst weg. Klingt nach einem Plan, oder?`, `${esc(w.ev.title)} um <b>${w.ev.start}</b>. Mal sehen, ob du dir morgen auch nur ein Wort merkst.`]) : `Morgen um <b>${w.ev.start}</b>: ${esc(w.ev.title)}. Ausgeschlafen sitzt du da wach – nicht als Zombie in der ersten Reihe.`]);
    // 3) Deine eigenen Zahlen: Laune nach langen vs. kurzen Nächten
    try {
      const md = Object.entries((S.ruhe && S.ruhe.mood) || {}).map(([k, v]) => { const n = S.nights.find(x => x.date === k); return n ? { v, tst: calc(n).tst } : null; }).filter(Boolean);
      const good = md.filter(x => x.tst >= 390), bad = md.filter(x => x.tst < 330), avg = a => a.reduce((s, x) => s + x.v, 0) / a.length;
      if (good.length >= 2 && bad.length >= 2 && avg(good) - avg(bad) >= .4) out.push(['🧠', `${bro ? 'Deine Zahlen lügen nicht' : 'Deine eigenen Daten'}: Nach 6,5 h+ Schlaf warst du <b>${String(avg(good).toFixed(1)).replace(".", ",")}/5</b> drauf, nach kurzen Nächten nur <b>${String(avg(bad).toFixed(1)).replace(".", ",")}/5</b>.`]);
    } catch (e) { }
    // 4) Serie, die auf dem Spiel steht
    try {
      if (typeof STREAKS !== 'undefined') { const s = streakOf(STREAKS[1][3]).cur; if (late <= 30 && s > 0) out.push(['🌙', `Deine Bett-Serie steht bei <b>${s} ${s === 1 ? 'Tag' : 'Tagen'}</b>. Leg dich in den nächsten ${Math.max(5, 30 - Math.max(0, late))} Minuten hin und mach ${s + 1} draus.`]);
        else if (late <= 30) out.push(['🌙', `Leg dich in den nächsten ${Math.max(5, 30 - Math.max(0, late))} Minuten hin – dann startet heute deine Bett-Serie.`]); }
    } catch (e) { }
    // 5) Dein eigenes Ziel aus der Einrichtung
    const pr = S.profile?.problems || [];
    if (pr.includes('chaos')) out.push(['⚓', bro ? pickV('chaos', ['Du wolltest raus aus dem Chaos, Bro. Heute Abend zählt – nicht nächsten Montag.', 'Chaos-Rhythmus bekämpfen und um diese Uhrzeit scrollen. Interessante Strategie.', 'Dein Rhythmus ruft an. Er will wissen, warum du noch wach bist.']) : 'Du wolltest raus aus dem Chaos-Rhythmus. Genau dieser Abend entscheidet das – nicht der nächste Montag.']);
    else if (pr.includes('morning')) out.push(['☀️', 'Morgen leicht hochkommen fängt genau jetzt an, nicht um ' + w.t + '.']);
    // 6) Ehrlicher Fakt zum Scrollen
    out.push(['📱', late > 0 ? `Du bist schon ${dur(late)} über deiner Bettzeit. Der Feed ist morgen auch noch da – dein Schlaf von heute nicht.` : 'Jede Viertelstunde Scrollen ist eine Viertelstunde weniger Schlaf. Der Feed läuft nicht weg.']);
    return { head, sub, lines: out.slice(0, 3) };
  };
  window.sleepNoteHtml = function (cls = '') {
    const n = sleepNote();
    return `<div class="sn ${cls}"><b class="sn-h">${n.head}</b><p class="sn-s">${n.sub}</p>${n.lines.map(([e, t]) => `<div class="sn-l"><i>${e}</i><span>${t}</span></div>`).join('')}</div>`;
  };

  /* In der Atempause: abends statt der Standardzeile die persönliche Nachricht */
  const _show = window.showPause;
  window.showPause = function () {
    _show();
    const m = document.querySelector('.alarm.pz .pz-msg'); if (!m) return;
    const blk = typeof activeBlock === 'function' ? activeBlock() : null, bro = (S.settings.tone || 'bro') === 'bro';
    // Eigene Handyzeit (z. B. Lernzeit) läuft → dazu passende Ansage statt Schlaf-Nachricht
    if (blk && blk.k !== 'sleep') { m.outerHTML = `<div class="sn sn-pz"><b class="sn-h">${esc(blk.name)} läuft bis ${blk.to}.</b><p class="sn-s">${bro ? pickV('blk', [`Bestimmt hilft dir Instagram jetzt beim ${blk.k === 'study' ? 'Lernen' : blk.k === 'meal' ? 'Essen' : 'Runterkommen'}. Ganz sicher. Leg es weg – in `, `Kurz reinschauen? Sagen alle. Und dann sind's 40 Minuten. Frei ist es wieder in `, `${blk.k === 'study' ? 'Lernen klappt erstaunlich schlecht mit TikTok in der Hand' : 'Dein Handy hat gerade Feierabend'}. Wer hätte das gedacht. Wieder frei in `]) : 'Dein Handy hat gerade Pause. Noch '}${(() => { const l = (toMin(blk.to) - toMin(nowHM()) + 1440) % 1440; return l < 60 ? l + ' Min' : dur(l); })()}${bro ? ' ist es wieder frei.' : ', dann ist es wieder frei.'}</p></div>`; return; }
    const nowR = rel(toMin(nowHM()));
    if (lateness() < -20 || nowR >= rel(toMin('05:30'))) return;
    m.outerHTML = sleepNoteHtml('sn-pz');
  };

  /* Auf „Heute“: wenn du nach deiner Bettzeit noch in der App bist */
  const _render = window.render;
  window.render = function (q) {
    _render(q);
    try {
      if (tab !== 'heute' || (typeof ob !== 'undefined' && ob) || S.session) return;
      const now = rel(toMin(nowHM())); if (lateness() < 0 || now >= rel(toMin('05:30'))) return;
      const btn = document.querySelector('#app .act-main'); if (!btn || document.querySelector('.sn-card')) return;
      btn.insertAdjacentHTML('beforebegin', `<div class="card sn-card sn-compact">${sleepNoteHtml()}</div>`); try { Orb.update({ scoreY: 0 }); } catch (e) { }
    } catch (e) { }
  };
  // Erstes Rendern ist schon passiert → einmal neu
  if (typeof S !== 'undefined' && S.profile) setTimeout(() => window.render(true), 0);
})();

</script>

    if (a === 'min') return closeOv();
    if (a === 'end') {
      if (Date.now() - endArm > 3500) { endArm = Date.now(); t.classList.add('arm'); t.textContent = 'Wirklich? Nochmal tippen'; buzz(6); setTimeout(() => { if (t.isConnected) { t.classList.remove('arm'); t.textContent = 'Silence beenden'; } }, 3500); return; }
      endArm = 0; return endSession();
    }
    if (t.dataset.bd === 'save') {
      const items = [0, 1, 2].map(i => $('#bd' + i)?.value.trim()).filter(Boolean); if (!items.length) { $('#bd0')?.focus(); toast('Schreib mindestens einen Gedanken auf'); return; }
      const at = $('#bdAt')?.value || ''; r.dumpAt = at; (r.dumps = r.dumps || []).push({ t: Date.now(), items, at, done: false }); r.dumps = r.dumps.slice(-30); save();
      const f = t.closest('.bd-form'); if (f && !RM()) f.classList.add('fly');
      buzz([10, 40, 16]); setTimeout(() => { OPEN.add('dump'); render(true); toast(`Geparkt bis ${at || 'morgen'}. Dein Kopf darf jetzt ruhen 🌙`); }, RM() ? 0 : 520); return;
    }
    if (t.dataset.bd === 'done') { const d = (r.dumps || []).find(x => String(x.t) === t.dataset.id); if (d) d.done = true; save(); const p = t.closest('.bd-park'); if (p && !RM()) { p.classList.add('gone'); setTimeout(() => render(true), 380); } else render(true); toast('Erledigt – weg damit ✓'); buzz(8); }
  }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest?.('[data-sil="open"]')) openOv(); });

  /* Nach jedem Zeichnen: Feiern, Zähler weiterlaufen lassen */
  const _render = window.render;
  window.render = function () { const out = _render.apply(this, arguments); try { if (tab === 'ruhe') { fireCelebrations(); justGrew = null; } } catch (e) { } return out; };
  addEventListener('load', () => { if (sil().silence) tick(); });
  if (document.readyState === 'complete' && sil().silence) tick();

  window.SIL = { hero, garden, week, dump, start: startSession, end: endSession, open: openOv, play: playSound, state: () => ({ cur: A.cur, ac: A.ac && A.ac.state }), MIN_PLANT };
})();

</script>
<script>
'use strict';
/* Offline – Verlauf-Tab (überschreibt vVerlauf aus app.js).
   Aufbau, bewusst knapp: Kopfzeile · drei Kennzahlen · Doom-Bilanz · EIN Graph mit Umschalter · größter Hebel · „Mehr“. */
(function () {
  let VR = 'w'; // 'w' = 7 Tage, 'm' = 30 Tage
  let VG = 'dur';
  const ic = (n, fb) => (window.ICON ? window.ICON(n) : fb || '');
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  const dk = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const days = n => { const t = new Date(todayKey() + 'T12:00'), out = []; for (let i = n - 1; i >= 0; i--) out.push(dk(new Date(t.getTime() - i * 864e5))); return out; };
  const fmtN = (x, d = 1) => x.toFixed(d).replace('.', ',');
  const bro = () => (S.settings.tone || 'bro') !== 'nice';
  const nDays = () => VR === 'w' ? 7 : 30;

  /* Score wie stats()/scorestats: Dauer 40 · Effizienz 30 · Regelmäßigkeit 30 */
  function parts(ns) {
    if (!ns.length) return null;
    const c = ns.map(calc), need = S.settings.need * 60, tst = avg(c.map(x => x.tst)), se = avg(c.map(x => x.se));
    const sdB = sd(ns.map(x => rel(toMin(x.bed)))), sdW = sd(ns.map(x => rel(toMin(x.out))));
    const d = Math.min(1, tst / need) * 40, e = Math.min(1, Math.max(0, (se - .6) / .3)) * 30, r = Math.max(0, 1 - ((sdB + sdW) / 2) / 90) * 30;
    const sm = window.sleepMetrics ? sleepMetrics(ns) : null; // gleiche Formel wie überall (Prozent-Score)
    return { d, e, r, total: sm ? sm.score : Math.round(d + e + r), tst, se, sdB, sdW, swing: (sdB + sdW) / 2, need, n: ns.length, c };
  }

  /* ---------- Kennzahlen: letzte 7 Nächte vs. 7 davor ---------- */
  const ARW = up => `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="${up ? 'M6 9.5V2.5M3 5.5l3-3 3 3' : 'M6 2.5v7M3 6.5l3 3 3-3'}"/></svg>`;
  function trendChip(diff, goodUp, txt, say) {
    if (diff == null) return `<span class="vk-tr">7 Nächte</span>`;
    if (Math.abs(diff) < 1) return `<span class="vk-tr" aria-label="gleich wie Vorwoche">± 0</span>`;
    const good = goodUp ? diff > 0 : diff < 0;
    return `<span class="vk-tr ${good ? 'up' : 'dn'}" aria-label="${say} zur Vorwoche">${ARW(diff > 0)}${txt}</span>`;
  }
  function tiles() {
    const all = sorted(), now = parts(all.slice(-7)), pv = all.length >= 10 ? parts(all.slice(-14, -7)) : null;
    const dT = pv ? now.tst - pv.tst : null, dS = pv ? now.total - pv.total : null, dR = pv ? now.swing - pv.swing : null;
    const m = v => Math.round(Math.abs(v));
    return `<div class="vk-row">
      <div class="vk"><span class="vk-l">Ø Schlaf</span><b data-count="${Math.round(now.tst)}" data-fmt="dur">${dur(now.tst)}</b>${trendChip(dT, true, dur(Math.abs(dT || 0)), (dT > 0 ? 'plus ' : 'minus ') + m(dT || 0) + ' Minuten')}</div>
      <button class="vk vk-btn" data-vscore aria-label="Schlaf-Score ${now.total} – Aufschlüsselung öffnen"><span class="vk-l">Score${ic('arrow')}</span><b data-count="${now.total}">${now.total}</b>${trendChip(dS, true, m(dS || 0), (dS > 0 ? 'plus ' : 'minus ') + m(dS || 0) + ' Punkte')}</button>
      <div class="vk"><span class="vk-l">Rhythmus</span><b>±${Math.round(now.swing)}<small>min</small></b>${trendChip(dR, false, m(dR || 0) + ' min', (dR > 0 ? 'plus ' : 'minus ') + m(dR || 0) + ' Minuten Schwankung')}</div>
    </div>`;
  }

  /* ---------- Doom-Bilanz: Handy in der Schlafenszeit ---------- */
  function sleepFrom() {
    const b = S.ruhe && Array.isArray(S.ruhe.blocks) ? (S.ruhe.blocks.find(x => x.k === 'sleep' && x.on) || S.ruhe.blocks.find(x => x.k === 'sleep')) : null;
    return b && b.from ? b.from : plan().bed;
  }
  function doomStats() {
    const ds = days(nDays()), set = new Set(ds), by = Object.fromEntries(S.nights.map(n => [n.date, n]));
    const from = rel(toMin(sleepFrom())), need = S.settings.need * 60, per = {};
    let entries = 0;
    ds.forEach(d => { const n = by[d]; if (!n || n.phoneMin == null) return; entries++;
      const late = Math.max(0, rel(toMin(n.bed)) - from); per[d] = Math.min(n.phoneMin, late); });
    // Atempausen, bei denen du doch reingegangen bist – während der handyfreien Schlafenszeit: je 5 Min
    const ps = (S.ruhe && S.ruhe.pauses) || [];
    if (typeof activeBlock === 'function') ps.forEach(p => { if (p.win !== false) return; let b = null; try { b = activeBlock(new Date(p.t)); } catch (e) { }
      if (!b || b.k !== 'sleep') return; const d = dk(new Date(p.t + 6 * 36e5)); if (!set.has(d)) return; entries++; per[d] = (per[d] || 0) + 5; });
    let doom = 0, lost = 0, nights = 0, worst = null;
    Object.entries(per).forEach(([d, v]) => { if (v <= 0) return; doom += v; nights++;
      if (by[d]) lost += Math.min(v, Math.max(0, need - calc(by[d]).tst));
      if (!worst || v > worst.v) worst = { d, v }; });
    return { doom, lost, nights, worst, entries, n: ds.length };
  }
  function doomCard() {
    const s = doomStats(), lbl = VR === 'w' ? 'Letzte 7 Tage' : 'Letzte 30 Tage';
    const head = `<div class="vd-h"><span class="vd-ico">${ic('phone')}</span><h2>Doom-Bilanz</h2><small>${lbl}</small></div>`;
    if (!s.entries) return `<div class="card vd" id="vdCard">${head}<p class="vd-empty">Trag beim Check-in ein, wie lange du abends am Handy warst – dann rechnen wir hier mit.</p></div>`;
    if (!s.doom) return `<div class="card vd" id="vdCard">${head}<p class="vd-empty"><b>Noch keine Doom-Minuten – stark.</b> ${bro() ? 'Der Algorithmus vermisst dich schon.' : 'Dein Handy hatte nachts frei.'}</p></div>`;
    const t = new Date(s.worst.d + 'T12:00'), wl = `${WD[t.getDay()]} ${t.getDate()}.${t.getMonth() + 1}.`;
    const eps = Math.round(s.doom / 25);
    const quip = bro()
      ? (eps >= 2 ? `Das sind ${eps} Folgen Serie. Nur ohne Serie.` : s.lost >= 30 ? 'Gescrollt statt geschlafen. Bester Tausch ever. Nicht.' : 'Kleine Runde. Der Feed hat trotzdem gewonnen.')
      : (s.lost ? 'Jede Viertelstunde früher weg vom Handy holst du dir zurück.' : 'Dein Schlaf hat diesmal kaum gelitten – weiter so.');
    const r = Math.max(4, Math.min(100, s.lost / s.doom * 100));
    return `<div class="card vd" id="vdCard">${head}
      <div class="vd-nums"><div><b data-count="${s.doom}" data-fmt="dur">${dur(s.doom)}</b><span>in der Schlafenszeit gedoomt</span></div>
        <div class="vd-lost"><b data-count="${s.lost}" data-fmt="dur">${dur(s.lost)}</b><span>Schlaf dadurch weg</span></div></div>
      <div class="vd-bar" aria-hidden="true"><i style="--w:${r.toFixed(1)}%"></i></div>
      <p class="vd-say">${s.nights} von ${s.n} Nächten betroffen<span>Schlimmste: ${wl} · <b>${dur(s.worst.v)}</b></span></p>
      <p class="vd-quip">${quip}</p>
      <p class="vd-foot">Geschätzt aus deinen Einträgen. Genau gemessen in der iPhone-App.</p></div>`;
  }

  /* ---------- Größter Hebel: ein Satz ---------- */
  function lever() {
    const cur = parts(sorted().slice(-7)); if (!cur) return '';
    const p = plan(), P = [['d', cur.d, 40], ['e', cur.e, 30], ['r', cur.r, 30]], gap = P.map(x => x[2] - x[1]), bi = gap.indexOf(Math.max(...gap)), g = Math.round(gap[bi]);
    const gain = { d: Math.round(Math.min(1, (cur.tst + 30) / cur.need) * 40 - cur.d), e: Math.round(Math.min(1, Math.max(0, (cur.se + .05 - .6) / .3)) * 30 - cur.e), r: Math.round(Math.max(0, 1 - Math.max(0, cur.swing - 30) / 90) * 30 - cur.r) };
    const k = P[bi][0], pts = Math.max(1, gain[k]);
    const txt = g < 3 ? 'Halte deinen Anker – viel mehr ist gerade nicht drin.' : {
      d: `Ab ${p.bed} ins Bett: 30 Min. mehr Schlaf bringen etwa <b>+${pts} Punkte</b>.`,
      e: `Erst müde ins Bett, Handy raus – weniger Wachliegen bringt etwa <b>+${pts} Punkte</b>.`,
      r: `Jeden Tag um ${p.wake} aufstehen, auch am Wochenende – das bringt etwa <b>+${pts} Punkte</b>.`
    }[k];
    return `<div class="card vh"><i>${ic(g < 3 ? 'trophy' : 'target')}</i><div><small>Dein größter Hebel</small><p>${txt}</p></div></div>`;
  }

  /* ---------- Inhalte für „Mehr“ ---------- */
  function moodBody() {
    const m = (S.ruhe && S.ruhe.mood) || {}, pts = Object.entries(m).map(([k, v]) => { const n = S.nights.find(x => x.date === k); return n ? { x: calc(n).tst / 60, y: Number(v), d: k } : null; }).filter(Boolean);
    if (pts.length < 3) return `<p class="small muted">Tipp im Tab „Silence“ morgens kurz an, wie es dir geht. Ab 3 Tagen siehst du hier, wie dein Schlaf deine Laune macht.</p>`;
    const x0 = 3, x1 = 10, X = v => (Math.max(x0, Math.min(x1, v)) - x0) / (x1 - x0) * 100, Y = v => (5 - v) / 4 * 100;
    const mx = avg(pts.map(p => p.x)), my = avg(pts.map(p => p.y)), vx = avg(pts.map(p => (p.x - mx) ** 2));
    const k = vx ? avg(pts.map(p => (p.x - mx) * (p.y - my))) / vx : 0, a = my - k * mx, f = v => Math.max(1, Math.min(5, a + k * v));
    const need = S.settings.need;
    const dots = pts.map((p, i) => `<i style="left:${X(p.x)}%;top:${Y(p.y)}%;--i:${i}"></i>`).join('');
    const say = k > .15 ? `Pro Stunde mehr Schlaf ist deine Stimmung im Schnitt <b>${fmtN(k)} Punkte</b> besser.` : k < -.15 ? 'Bei dir hängt die Laune bisher kaum an der Schlafdauer.' : 'Noch kein klarer Zusammenhang – ein paar Tage mehr, dann wird es deutlich.';
    return `<div class="vm-plot" role="img" aria-label="Stimmung nach Schlafdauer, ${pts.length} Tage"><span class="vm-y t">super</span><span class="vm-y b">mies</span><b class="vm-need" style="left:${X(need)}%"><em>Ziel ${fmtN(need)} h</em></b>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="${Y(f(x0))}" x2="100" y2="${Y(f(x1))}" class="fit"/></svg>${dots}</div>
      <div class="vm-x"><span>3 h</span><span>Schlaf</span><span>10 h</span></div><p class="vm-say">${say}</p>`;
  }
  function numbers() {
    const cur = parts(sorted().slice(-nDays())); if (!cur) return '<p class="small muted">Noch keine Nächte.</p>';
    const t = cur.c.map(x => x.tst);
    return `<div class="kpis"><div class="kpi"><span>Ø Schlaf</span><strong>${dur(cur.tst)}</strong></div><div class="kpi"><span>Effizienz</span><strong>${Math.round(cur.se * 100)} %</strong></div><div class="kpi"><span>Nächte</span><strong>${cur.n}</strong></div>
      <div class="kpi"><span>Kürzeste</span><strong>${dur(Math.min(...t))}</strong></div><div class="kpi"><span>Längste</span><strong>${dur(Math.max(...t))}</strong></div><div class="kpi"><span>Streuung ±</span><strong>${Math.round(cur.sdB)}′/${Math.round(cur.sdW)}′</strong></div></div>
      <p class="muted small">Basiert auf CBT-I (Verhaltenstherapie bei Schlafstörungen). Kein Ersatz für ärztlichen Rat.</p>`;
  }
  function coachBody() {
    const p = plan(), all = coachTips();
    return `<p class="vx-plan">Dein Fenster <b>${p.bed} → ${p.wake}</b> · ${dur(p.win)}${p.mode === 'fokus' ? ' <span class="tag w">Fokus</span>' : ''}</p>${all.slice(0, 4).map(tipRow).join('')}`;
  }
  function more(hasNights) {
    const body = hasNights
      ? `<h3>Coach</h3>${coachBody()}<h3>Stimmung × Schlaf</h3>${moodBody()}<h3>Alle Zahlen <span id="vrNumL">· ${nDays()} Tage</span></h3><div id="vrNum">${numbers()}</div>`
      : `<h3>Coach</h3>${coachBody()}`;
    return disc('vmore', `${ic('sparkles')}<span>Mehr<small>${hasNights ? 'Coach-Tipps, Stimmung, alle Zahlen' : 'Coach-Tipps'}</small></span>`, body, 'vx');
  }

  /* ---------- Graph (Inline-SVG, eine Achse, Tooltip per Tippen/Halten) ---------- */
  const GTABS = [['dur', 'Dauer'], ['zeit', 'Zeiten'], ['handy', 'Handy'], ['score', 'Score']];
  const MW = ['', 'mies', 'naja', 'okay', 'gut', 'super'];
  const f1 = v => (+v).toFixed(1);
  const dLab = d => { const t = new Date(d + 'T12:00'); return `${d === todayKey() ? 'Heute' : WD[t.getDay()]} ${t.getDate()}.${t.getMonth() + 1}.`; };
  const sgn = m => (m > 0 ? '+' : m < 0 ? '−' : '±') + dur(Math.abs(m));
  const barP = (x, y0, y1, w) => { const h = y0 - y1; if (h < .5) return ''; const r = Math.min(4, w / 2, h), l = x - w / 2, rr = x + w / 2; return `M${f1(l)} ${f1(y0)}V${f1(y1 + r)}Q${f1(l)} ${f1(y1)} ${f1(l + r)} ${f1(y1)}H${f1(rr - r)}Q${f1(rr)} ${f1(y1)} ${f1(rr)} ${f1(y1 + r)}V${f1(y0)}Z`; };
  const lineP = pts => { let d = '', on = false; pts.forEach(p => { if (!p) { on = false; return; } d += (on ? 'L' : 'M') + f1(p[0]) + ' ' + f1(p[1]); on = true; }); return d; };
  let GD = null; // Daten des sichtbaren Graphen für den Tooltip

  function frame(ds, W, H, top, bot, y, ticks, tlab) {
    const L = 30, R = 6, n = ds.length, sw = (W - L - R) / n, X = i => L + sw * (i + .5);
    const grid = ticks.map(v => `<line class="vg-g" x1="${L}" x2="${W - R}" y1="${f1(y(v))}" y2="${f1(y(v))}"/><text class="vg-yt" x="${L - 7}" y="${f1(y(v) + 3.5)}">${tlab(v)}</text>`).join('');
    const xl = ds.map((d, i) => {
      const t = new Date(d + 'T12:00'), show = n <= 7 || (n - 1 - i) % 7 === 0; if (!show) return '';
      const s = n <= 7 ? (d === todayKey() ? 'Heute' : WD[t.getDay()]) : `${t.getDate()}.${t.getMonth() + 1}.`;
      const anc = n > 7 && i === n - 1 ? 'end' : 'middle', x = anc === 'end' ? X(i) + sw / 2 : X(i);
      return `<text class="vg-xt${d === todayKey() ? ' now' : ''}" x="${f1(x)}" y="${H - 5}" text-anchor="${anc}">${s}</text>`;
    }).join('');
    return { L, R, sw, X, n, W0: W, chrome: grid + xl, base: H - bot };
  }
  const svgOpen = (W, H, lab) => `<svg class="vg-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" tabindex="0" aria-label="${lab} – Pfeiltasten zeigen die Werte je Tag">`;
  const hit = (fr, top, H) => `<line class="vg-x" x1="0" x2="0" y1="${top - 4}" y2="${fr.base}" hidden/><rect class="vg-hit" x="${fr.L}" y="0" width="${fr.sw * fr.n}" height="${H}"/>`;
  const key = (cls, t, kind = 'dot') => `<span class="vg-k"><i class="vk-${kind} ${cls}"></i>${t}</span>`;
  // Werte-Tabelle nur für Screenreader (nicht sichtbar)
  const table = (cap, heads, rows) => `<table class="vg-sr"><caption>${cap}</caption><thead><tr><th>Tag</th>${heads.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr><td>${r[0]}</td>${r.slice(1).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  function gDur(ds, by, W) {
    const need = S.settings.need * 60, vals = ds.map(d => by[d] ? calc(by[d]).tst : null), have = vals.filter(v => v != null);
    const H = 176, top = 14, bot = 20, hiH = Math.max(Math.ceil(need / 60) + 1, Math.ceil(Math.max(...have) / 60));
    const y = v => top + (1 - v / 60 / hiH) * (H - top - bot);
    const ticks = []; for (let h = 0; h <= hiH; h += hiH > 10 ? 4 : 2) ticks.push(h * 60);
    const fr = frame(ds, W, H, top, bot, y, ticks, v => v / 60 + ' h');
    const bw = Math.min(20, fr.sw * .6);
    const bars = vals.map((v, i) => v == null ? '' : `<path class="vg-bar" style="--i:${i}" d="${barP(fr.X(i), fr.base, y(v), bw)}"/>`).join('');
    const yz = y(need), ref = `<line class="vg-ref" x1="${fr.L}" x2="${W - fr.R}" y1="${f1(yz)}" y2="${f1(yz)}"/><text class="vg-rl" x="${W - fr.R}" y="${f1(yz - 5)}" text-anchor="end">Ziel ${dur(need)}</text>`;
    const mean = avg(have), diff = mean - need, inG = have.filter(v => v >= need - 30).length;
    const sub = `<b>${inG} von ${have.length}</b> Nächten im Ziel`;
    GD = { fr, rows: ds.map((d, i) => vals[i] == null ? null : [dur(vals[i]), `${sgn(vals[i] - need)} zum Ziel`]) };
    return { sub, svg: `${svgOpen(W, H, `Schlafdauer pro Nacht, Ø ${dur(mean)}, ${Math.abs(diff) < 10 ? 'im Ziel' : dur(Math.abs(diff)) + (diff < 0 ? ' unter' : ' über') + ' dem Ziel'}`)}${fr.chrome}${bars}${ref}${hit(fr, top, H)}</svg>`,
      tab: table('Schlafdauer', ['Schlaf', 'zum Ziel'], ds.filter(d => by[d]).map(d => [dLab(d), dur(calc(by[d]).tst), sgn(calc(by[d]).tst - need)])) };
  }

  function gZeit(ds, by, W) {
    const p = plan(), m20 = t => (toMin(t) + 1440 - 1200) % 1440, cl = v => Math.max(0, Math.min(960, v));
    const H = 200, top = 12, bot = 20, y = v => top + cl(v) / 960 * (H - top - bot);
    const fr = frame(ds, W, H, top, bot, y, [0, 240, 480, 720, 960], v => String((20 + v / 60) % 24).padStart(2, '0'));
    const B = ds.map((d, i) => by[d] ? [fr.X(i), y(m20(by[d].bed))] : null), O = ds.map((d, i) => by[d] ? [fr.X(i), y(m20(by[d].out))] : null);
    let band = ''; for (let i = 0; i < ds.length; i++) { if (!B[i]) continue; let j = i; while (j + 1 < ds.length && B[j + 1]) j++;
      band += j > i ? `<path class="vg-span" d="${lineP(B.slice(i, j + 1))}L${O.slice(i, j + 1).reverse().map(q => f1(q[0]) + ' ' + f1(q[1])).join('L')}Z"/>` : `<line class="vg-span1" x1="${f1(B[i][0])}" x2="${f1(B[i][0])}" y1="${f1(B[i][1])}" y2="${f1(O[i][1])}"/>`; i = j; }
    const r = ds.length > 7 ? 2.5 : 4;
    const dots = (P, c) => P.map((q, i) => q ? `<circle class="vg-dot ${c}" style="--i:${i}" cx="${f1(q[0])}" cy="${f1(q[1])}" r="${r}"/>` : '').join('');
    const yw = y(m20(p.wake)), ref = `<line class="vg-ref" x1="${fr.L}" x2="${W - fr.R}" y1="${f1(yw)}" y2="${f1(yw)}"/><text class="vg-rl" x="${W - fr.R}" y="${f1(yw + 13)}" text-anchor="end">Anker ${p.wake}</text>`;
    const have = ds.filter(d => by[d]), sdB = Math.round(sd(have.map(d => m20(by[d].bed)))), sdO = Math.round(sd(have.map(d => m20(by[d].out))));
    const sub = have.length < 2 ? 'Ab 2 Nächten siehst du deine Schwankung.' : `Streuung Bett <b>±${sdB}</b> · Auf <b>±${sdO}</b> min`;
    GD = { fr, rows: ds.map(d => { const n = by[d]; return n ? [`${n.bed} → ${n.out}`, `${sgn(m20(n.out) - m20(p.wake))} zum Anker`] : null; }) };
    return { sub, leg: key('s-bed', 'ins Bett') + key('s-out', 'aufgestanden'),
      svg: `${svgOpen(W, H, `Bett- und Aufstehzeit je Nacht, Bettzeit schwankt um ${sdB}, Aufstehen um ${sdO} Minuten`)}${fr.chrome}${band}${ref}<path class="vg-line s-bed" pathLength="1" d="${lineP(B)}"/><path class="vg-line s-out" pathLength="1" d="${lineP(O)}"/>${dots(B, 's-bed')}${dots(O, 's-out')}${hit(fr, top, H)}</svg>`,
      tab: table('Bett- und Aufstehzeit', ['Bett', 'Auf'], have.map(d => [dLab(d), by[d].bed, by[d].out])) };
  }

  function gHandy(ds, by, W) {
    const mood = (S.ruhe && S.ruhe.mood) || {}, ph = ds.map(d => by[d] && by[d].phoneMin != null ? by[d].phoneMin : null), md = ds.map(d => mood[d] != null ? Number(mood[d]) : null);
    const hp = ph.filter(v => v != null);
    if (!hp.length) return { empty: 'Trag beim Check-in ein, wie lange du abends am Handy warst.' };
    const H = 168, top = 14, bot = 20, mx = Math.max(60, Math.ceil(Math.max(0, ...hp) / 60) * 60), y = v => top + (1 - v / mx) * (H - top - bot);
    const st = mx > 180 ? 120 : 60, tk = []; for (let v = 0; v <= mx; v += st) tk.push(v);
    const fr = frame(ds, W, H, top, bot, y, tk, v => v ? v / 60 + ' h' : '0');
    const bw = Math.min(20, fr.sw * .6), mean = avg(hp);
    const bars = ph.map((v, i) => v == null ? '' : v === 0 ? `<rect class="vg-zero" x="${f1(fr.X(i) - bw / 2)}" y="${f1(fr.base - 2)}" width="${f1(bw)}" height="2" rx="1"/>` : `<path class="vg-bar ph" style="--i:${i}" d="${barP(fr.X(i), fr.base, y(v), bw)}"/>`).join('');
    const ya = y(mean), ref = `<line class="vg-ref avg" x1="${fr.L}" x2="${W - fr.R}" y1="${f1(ya)}" y2="${f1(ya)}"/><text class="vg-rl" x="${W - fr.R}" y="${f1(ya - 5)}" text-anchor="end">Ø ${mean ? dur(mean) : '0 Min'}</text>`;
    const lo = ds.map((d, i) => ph[i] != null && md[i] != null ? [ph[i], md[i]] : null).filter(Boolean), a = lo.filter(x => x[0] <= 30), b = lo.filter(x => x[0] > 30);
    const sub = a.length && b.length ? `Wenig Handy → Laune <b>${fmtN(avg(a.map(x => x[1])))}</b> statt <b>${fmtN(avg(b.map(x => x[1])))}</b>` : `Ø <b>${dur(mean)}</b> Handy pro Abend`;
    GD = { fr, rows: ds.map((d, i) => ph[i] == null && md[i] == null ? null : [ph[i] == null ? '–' : ph[i] ? `${dur(ph[i])} Handy` : 'kein Handy', md[i] == null ? '' : `Laune am Morgen: ${MW[md[i]]}`]) };
    return { sub, svg: `${svgOpen(W, H, `Handy abends in Minuten, Ø ${dur(mean)}`)}${fr.chrome}${bars}${ref}${hit(fr, top, H)}</svg>`,
      tab: table('Handy abends und Stimmung', ['Handy', 'Stimmung'], ds.filter((d, i) => ph[i] != null || md[i] != null).map(d => { const i = ds.indexOf(d); return [dLab(d), ph[i] == null ? '–' : dur(ph[i]), md[i] == null ? '–' : MW[md[i]]]; })) };
  }

  function gScore(ds, by, W) {
    const all = sorted(), sc = {}; all.forEach((x, j) => { sc[x.date] = parts(all.slice(Math.max(0, j - 6), j + 1)).total; });
    const v = ds.map(d => by[d] ? sc[d] : null), have = v.filter(x => x != null);
    if (have.length < 2) return { empty: 'Ab 2 Nächten zeichnen wir hier deinen Score-Verlauf.' };
    const H = 168, top = 18, bot = 20, y = s => top + (1 - s / 100) * (H - top - bot);
    const fr = frame(ds, W, H, top, bot, y, [0, 50, 100], s => s);
    const P = v.map((s, i) => s == null ? null : [fr.X(i), y(s)]);
    let area = ''; for (let i = 0; i < P.length; i++) { if (!P[i]) continue; let j = i; while (j + 1 < P.length && P[j + 1]) j++;
      if (j > i) area += `<path class="vg-area" d="${lineP(P.slice(i, j + 1))}L${f1(P[j][0])} ${fr.base}L${f1(P[i][0])} ${fr.base}Z"/>`; i = j; }
    const li = v.reduce((k, s, i) => s != null ? i : k, -1), last = v[li], first = have[0];
    const dots = P.map((q, i) => q && (ds.length <= 7 || i === li) ? `<circle class="vg-dot sc${i === li ? ' end' : ''}" style="--i:${i}" cx="${f1(q[0])}" cy="${f1(q[1])}" r="${i === li ? 5 : 3.5}"/>` : '').join('');
    const lab = `<text class="vg-end" x="${f1(Math.min(W - fr.R, P[li][0]))}" y="${f1(P[li][1] - 10)}" text-anchor="${P[li][0] > W - 30 ? 'end' : 'middle'}">${last}</text>`;
    const dl = last - first, sub = `Gleitend über 7 Nächte · ${Math.abs(dl) < 3 ? 'stabil' : dl > 0 ? `<b>+${dl}</b>` : `<b>−${-dl}</b>`}`;
    GD = { fr, rows: ds.map((d, i) => v[i] == null ? null : [`Score ${v[i]}`, `${dur(calc(by[d]).tst)} geschlafen`]) };
    return { sub, svg: `${svgOpen(W, H, `Schlaf-Score-Verlauf, zuletzt ${last}`)}${fr.chrome}${area}<path class="vg-line sc" pathLength="1" d="${lineP(P)}"/>${dots}${lab}${hit(fr, top, H)}</svg>`,
      tab: table('Schlaf-Score', ['Score'], ds.filter(d => by[d]).map(d => [dLab(d), sc[d]])) };
  }

  const ghost = () => `<svg class="vg-ghost" viewBox="0 0 200 64" aria-hidden="true">${[30, 44, 24, 52, 38, 46, 34].map((h, i) => `<path style="--i:${i}" d="${barP(22 + i * 26, 60, 60 - h, 14)}"/>`).join('')}</svg>`;
  function graphInner(W) {
    const ds = days(nDays()), by = Object.fromEntries(S.nights.map(n => [n.date, n]));
    GD = null;
    if (!ds.some(d => by[d])) return { sub: '', html: `<div class="vg-empty">${ghost()}<p>In diesem Zeitraum gibt es noch keine Nacht.</p></div>` };
    const g = { dur: gDur, zeit: gZeit, handy: gHandy, score: gScore }[VG](ds, by, W);
    if (g.empty) return { sub: '', html: `<div class="vg-empty">${ghost()}<p>${g.empty}</p></div>` };
    return { sub: g.sub, html: `<div class="vg-wrap">${g.svg}<div class="vg-tip" role="status" hidden></div></div>${g.leg ? `<div class="vg-leg" aria-hidden="true">${g.leg}</div>` : ''}${g.tab}` };
  }
  function graphCard() {
    return `<div class="card vg">
      <div class="seg vg-seg" role="tablist" aria-label="Graph wählen">${GTABS.map(([k, l]) => `<button role="tab" data-vg="${k}" aria-selected="${VG === k}" class="${VG === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="vg-meta"><p class="vg-sub" id="vgSub"></p><div class="vg-rng" role="group" aria-label="Zeitraum">${[['w', '7T', '7 Tage'], ['m', '30T', '30 Tage']].map(([k, l, a]) => `<button data-vr="${k}" aria-pressed="${VR === k}" aria-label="${a}" class="${VR === k ? 'on' : ''}"><span>${l}</span></button>`).join('')}</div></div>
      <div id="vgBox" class="vg-box"></div></div>`;
  }
  function mountGraph(anim = true) {
    const box = document.getElementById('vgBox'); if (!box) return;
    const W = Math.max(260, Math.round(box.clientWidth || 316)), g = graphInner(W), sub = document.getElementById('vgSub');
    box.classList.toggle('still', !anim); box.innerHTML = g.html; box._w = W; if (sub) sub.innerHTML = g.sub;
  }
  addEventListener('resize', () => { const b = document.getElementById('vgBox'); if (b && Math.abs((b.clientWidth || 0) - (b._w || 0)) > 4) mountGraph(false); });

  /* Tooltip: Tag unter dem Finger, Fadenkreuz, schlanke Werte + Bearbeiten */
  const by_ = d => S.nights.some(n => n.date === d);
  function showTip(svg, i) {
    const wrap = svg.closest('.vg-wrap'), tip = wrap && wrap.querySelector('.vg-tip'); if (!GD || !tip) return;
    const fr = GD.fr; i = Math.max(0, Math.min(fr.n - 1, i)); wrap._i = i;
    const d = days(nDays())[i], rows = GD.rows[i], x = fr.X(i);
    const c = svg.querySelector('.vg-x'); if (c) { c.setAttribute('x1', x); c.setAttribute('x2', x); c.removeAttribute('hidden'); }
    svg.querySelectorAll('.on').forEach(e => e.classList.remove('on')); svg.querySelectorAll(`[style="--i:${i}"]`).forEach(e => e.classList.add('on'));
    tip.textContent = '';
    const tx = document.createElement('div'); tx.className = 'vg-tt';
    const h = document.createElement('small'); h.textContent = dLab(d); tx.append(h);
    const v = document.createElement('b'); v.textContent = rows ? rows[0] : 'Keine Daten'; tx.append(v);
    if (rows && rows[1]) { const s = document.createElement('span'); s.textContent = rows[1]; tx.append(s); }
    const btn = document.createElement('button'); btn.className = 'vg-edit'; btn.dataset.act = 'edit'; btn.dataset.date = d;
    btn.setAttribute('aria-label', (by_(d) ? 'Nacht bearbeiten: ' : 'Nacht nachtragen: ') + dLab(d)); btn.innerHTML = by_(d) ? (I.edit || '✎') : '<b>+</b>';
    tip.append(tx, btn); tip.hidden = false;
    const sc = svg.getBoundingClientRect().width / fr.W0, px = x * sc, ww = wrap.clientWidth, tw = tip.offsetWidth;
    tip.style.left = Math.round(Math.max(0, Math.min(ww - tw, px - tw / 2))) + 'px';
    tip.style.top = Math.round(-tip.offsetHeight - 4) + 'px';
  }
  function hideTip(wrap) { if (!wrap) return; const t = wrap.querySelector('.vg-tip'); if (t) t.hidden = true; wrap._i = null;
    $$('.vg-x', wrap).forEach(c => c.setAttribute('hidden', '')); $$('.vg-svg .on', wrap).forEach(e => e.classList.remove('on')); }
  function idxAt(svg, cx) { const r = svg.getBoundingClientRect(), fr = GD.fr, vx = (cx - r.left) / r.width * fr.W0; return Math.floor((vx - fr.L) / fr.sw); }
  document.addEventListener('pointerdown', e => { const s = e.target.closest && e.target.closest('.vg-svg'); if (s && GD) { showTip(s, idxAt(s, e.clientX)); return; }
    if (!(e.target.closest && e.target.closest('.vg-tip'))) $$('.vg-wrap').forEach(hideTip); });
  document.addEventListener('pointermove', e => { const s = e.target.closest && e.target.closest('.vg-svg'); if (s && GD && (e.pointerType === 'mouse' || e.buttons)) showTip(s, idxAt(s, e.clientX)); });
  document.addEventListener('pointerout', e => { const s = e.target.closest && e.target.closest('.vg-svg'); if (s && e.pointerType === 'mouse' && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.vg-wrap'))) hideTip(s.closest('.vg-wrap')); });
  document.addEventListener('keydown', e => { const s = e.target.closest && e.target.closest('.vg-svg'); if (!s || !GD) return; const w = s.closest('.vg-wrap');
    if (e.key === 'Escape') return hideTip(w);
    if (e.key === 'Enter' && w._i != null) { e.preventDefault(); return checkinSheet(days(nDays())[w._i]); }
    const dlt = { ArrowLeft: -1, ArrowRight: 1, Home: -99, End: 99 }[e.key]; if (dlt == null) return; e.preventDefault();
    showTip(s, w._i == null ? GD.fr.n - 1 : w._i + dlt); });
  document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('vg-svg') && GD) { const w = e.target.closest('.vg-wrap'); if (w._i == null) showTip(e.target, GD.fr.n - 1); } });

  /* Umschalter: Graph-Art, Zeitraum, Score-Kachel */
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-vg]');
    if (g) { if (g.dataset.vg === VG) return; VG = g.dataset.vg; try { buzz(8); } catch (x) { }
      const seg = g.parentElement; $$('button', seg).forEach(x => { x.classList.toggle('on', x === g); x.setAttribute('aria-selected', x === g); }); movePill(seg); mountGraph(true); return; }
    const r = e.target.closest('[data-vr]');
    if (r) { if (r.dataset.vr === VR) return; VR = r.dataset.vr; try { buzz(8); } catch (x) { }
      $$('[data-vr]').forEach(x => { x.classList.toggle('on', x === r); x.setAttribute('aria-pressed', x === r); }); mountGraph(true);
      const dc = document.getElementById('vdCard'); if (dc) { dc.outerHTML = doomCard(); const n = document.getElementById('vdCard'); if (n) countUp(n); }
      const num = document.getElementById('vrNum'); if (num) num.innerHTML = numbers();
      const nl = document.getElementById('vrNumL'); if (nl) nl.textContent = '· ' + nDays() + ' Tage';
      return; }
    if (e.target.closest('[data-vscore]')) { try { buzz(8); } catch (x) { } if (typeof openScoreStats === 'function') openScoreStats(); }
  });

  window.vVerlauf = function () {
    const ns = sorted(), last = ns[ns.length - 1];
    if (!ns.length) return `<div class="greet vr-greet"><h1>Verlauf</h1><p>Noch keine Nacht eingetragen.</p></div>
      <div class="card vg vg-first"><div class="vg-empty">${ghost()}<p>Nach deinem ersten Check-in siehst du hier Dauer, Zeiten, Handy und Score.</p></div>
      <button class="btn accent full" data-act="checkin">${I.book}Erste Nacht eintragen</button></div>${more(false)}`;
    const c = calc(last), dt = new Date(last.date + 'T12:00'), recent = last.date === todayKey() || last.date === days(2)[0];
    requestAnimationFrame(() => mountGraph(true));
    return `<div class="greet vr-greet"><h1>Verlauf</h1><p>${recent ? 'Letzte Nacht' : WD[dt.getDay()] + ' ' + dt.getDate() + '.' + (dt.getMonth() + 1) + '.'} <b>${dur(c.tst)}</b> · ${last.bed}–${last.out}</p></div>
      ${tiles()}${doomCard()}${graphCard()}${lever()}${more(true)}`;
  };
})();

</script>
<script>
'use strict';
/* Schlafanker – Feste Handyzeiten: einmal einstellen, gilt dann automatisch (z. B. Schlafenszeit, Lernzeit).
   Gespeichert in S.ruhe.blocks. Beeinflusst Ruhezeit-Anzeige, Atempause und die spätere iPhone-Sperre. */
(function () {
  const DAYS = [[1, 'Mo'], [2, 'Di'], [3, 'Mi'], [4, 'Do'], [5, 'Fr'], [6, 'Sa'], [0, 'So']];
  const PRESETS = [
    ['sleep', '🌙', 'Schlafenszeit', null, null],
    ['study', '📚', 'Lernzeit', '15:00', '17:00'],
    ['meal', '🍽️', 'Essen', '19:00', '19:45'],
    ['morning', '🌅', 'Morgen ohne Feed', null, null],
    ['custom', '⏳', 'Eigene Zeit', '20:00', '21:00']
  ];
  const ico = k => (PRESETS.find(p => p[0] === k) || PRESETS[4])[1];
  const uid = () => Math.random().toString(36).slice(2, 9);
  function blocks() {
    const r = R(); if (!r.blocks) {
      const p = plan(), w = S.settings.wake;
      r.blocks = [{ id: uid(), k: 'sleep', name: 'Schlafenszeit', from: p.wind, to: w, days: [0, 1, 2, 3, 4, 5, 6], on: true }];
      save();
    }
    return r.blocks;
  }
  const inBlock = (b, d = new Date()) => {
    if (!b.on) return false; const now = d.getHours() * 60 + d.getMinutes(), f = toMin(b.from), t = toMin(b.to);
    if (f <= t) return b.days.includes(d.getDay()) && now >= f && now < t;
    // über Mitternacht: zählt zum Starttag
    if (now >= f) return b.days.includes(d.getDay());
    const y = new Date(d); y.setDate(d.getDate() - 1); return now < t && b.days.includes(y.getDay());
  };
  window.activeBlock = (d = new Date()) => blocks().find(b => inBlock(b, d)) || null;
  const daysLbl = ds => ds.length === 7 ? 'jeden Tag' : [1, 2, 3, 4, 5].every(x => ds.includes(x)) && ds.length === 5 ? 'Mo–Fr' : ds.length === 2 && ds.includes(0) && ds.includes(6) ? 'Wochenende' : DAYS.filter(([v]) => ds.includes(v)).map(x => x[1]).join(' ');

  /* Ruhezeit-Anzeige & Atempause kennen jetzt auch die festen Zeiten */
  const _qw = window.quietWindow;
  window.quietWindow = function () {
    const a = activeBlock(); if (a) return { from: a.from, to: a.to, active: true, inMin: 0, name: a.name };
    const base = _qw(); const sl = blocks().find(b => b.k === 'sleep' && b.on);
    if (sl) { const now = toMin(nowHM()); return { ...base, from: sl.from, to: sl.to, active: false, inMin: (toMin(sl.from) - now + 1440) % 1440, name: sl.name }; }
    return base;
  };

  /* Karte im Silence-Tab */
  /* 24-h-Leiste für heute: rote Abschnitte = kein Handy */
  function dayBar(bs) {
    const segs = [], d = new Date(), today = d.getDay(), yest = (today + 6) % 7;
    bs.filter(b => b.on).forEach(b => { const f = toMin(b.from), t = toMin(b.to);
      if (f < t) { if (b.days.includes(today)) segs.push([f, t]); }
      else { if (b.days.includes(yest)) segs.push([0, t]); if (b.days.includes(today)) segs.push([f, 1440]); } });
    const now = d.getHours() * 60 + d.getMinutes();
    return `<div class="hz-bar" aria-hidden="true">${segs.map(([f, t]) => `<i style="left:${f / 14.4}%;width:${(t - f) / 14.4}%"></i>`).join('')}<b style="left:${now / 14.4}%"></b></div>
      <div class="hz-axis"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>`;
  }
  function nextChange(bs) {
    const a = activeBlock(); if (a) return { on: true, txt: `Kein Handy bis <b>${a.to}</b>`, sub: a.name };
    let best = null; const d = new Date(), now = d.getHours() * 60 + d.getMinutes();
    bs.filter(b => b.on).forEach(b => { for (let k = 0; k < 8; k++) { const day = (d.getDay() + k) % 7; if (!b.days.includes(day)) continue; const inM = k * 1440 + toMin(b.from) - now; if (inM > 0 && (!best || inM < best.inM)) best = { inM, b }; break; } });
    return best ? { on: false, txt: `Handy frei bis <b>${best.b.from}</b>`, sub: `dann ${best.b.name} (${best.b.from}–${best.b.to})` } : { on: false, txt: 'Handy frei', sub: 'keine handyfreie Zeit aktiv' };
  }
  function card() {
    const bs = blocks(), a = activeBlock(), st = nextChange(bs);
    return `<div class="card hz"><div class="hz-head"><div><h2>Handyfreie Zeiten</h2><p class="sub">In diesen Zeiten: <b>kein Handy</b>. Öffnest du Social Media, kommt sofort die Atempause.</p></div></div>
      <div class="hz-status ${st.on ? 'on' : ''}"><span class="hz-dot"></span><div><strong>${st.txt}</strong><small>${esc(st.sub)}</small></div></div>
      ${dayBar(bs)}
      <div class="hz-list">${bs.map(b => `<div class="hz-row ${b.on ? '' : 'off'} ${a && a.id === b.id ? 'live' : ''}">
        <button class="hz-main" data-hz-edit="${b.id}"><span class="hz-ic">${ico(b.k)}</span><span class="hz-t"><small class="hz-kh">Kein Handy${a && a.id === b.id ? ' · <em>jetzt</em>' : ''}</small><b>${b.from} – ${b.to}</b><small>${esc(b.name)} · ${daysLbl(b.days)}</small></span></button>
        <button class="sw ${b.on ? 'on' : ''}" data-hz-tog="${b.id}" aria-label="${esc(b.name)} an/aus"></button></div>`).join('')}</div>
      <button class="btn light full hz-add" data-hz-new="1">+ Handyfreie Zeit hinzufügen</button></div>`;
  }
  const _v = window.vRuhe;
  window.vRuhe = function () {
    const h = _v(), hero = window.SIL && SIL.hero ? SIL.hero() : '';
    // Runder „Silence starten“-Knopf bleibt ganz oben – die handyfreien Zeiten kommen direkt darunter
    if (hero && h.includes(hero)) return h.replace(hero, hero + card());
    return h.replace(/(<div class="greet">[\s\S]*?<\/div>)/, '$1' + card());
  };

  /* Bearbeiten-Sheet */
  let draft = null;
  function editor(b, isNew) {
    draft = JSON.parse(JSON.stringify(b)); draft.isNew = isNew;
    openSheet(`<h2>${isNew ? 'Neue handyfreie Zeit' : 'Handyfreie Zeit bearbeiten'}</h2><p class="muted" style="margin:0 0 14px">In dieser Zeit gilt: <b>kein Handy</b>. Social Media öffnet erst die Atempause – in der iPhone-App wird es dann wirklich gesperrt.</p>
      ${isNew ? `<div class="hz-presets">${PRESETS.map(([k, e, n]) => `<button class="${draft.k === k ? 'on' : ''}" data-hz-pre="${k}"><i>${e}</i>${n}</button>`).join('')}</div>` : ''}
      <div class="field"><label>Name</label><input class="ob-in hz-name" id="hzName" maxlength="28" value="${esc(draft.name)}"></div>
      <div class="hz-from-to"><span>Kein Handy</span></div><div class="two"><div class="field"><label>Von</label><input type="time" id="hzFrom" value="${draft.from}"></div><div class="field"><label>Bis</label><input type="time" id="hzTo" value="${draft.to}"></div></div>
      <div class="field"><label>An welchen Tagen?</label><div class="hz-days">${DAYS.map(([v, l]) => `<button class="${draft.days.includes(v) ? 'on' : ''}" data-hz-day="${v}">${l}</button>`).join('')}</div>
        <div class="hz-quick"><button data-hz-days="all">Jeden Tag</button><button data-hz-days="week">Mo–Fr</button><button data-hz-days="we">Wochenende</button></div></div>
      <div class="stack"><button class="btn full" data-hz-save="1">Speichern</button>${isNew ? '' : '<button class="btn light full" data-hz-del="1">Löschen</button>'}<button class="btn light full" data-act="close">Abbrechen</button></div>`);
  }

    if (t.dataset.hzPre) { const pr = PRESETS.find(x => x[0] === t.dataset.hzPre), p = plan(), w = S.settings.wake;
      draft.k = pr[0]; draft.name = pr[2]; draft.from = pr[3] || (pr[0] === 'sleep' ? p.wind : w); draft.to = pr[4] || (pr[0] === 'sleep' ? w : fromMin(toMin(w) + 30));
      $('#hzName').value = draft.name; $('#hzFrom').value = draft.from; $('#hzTo').value = draft.to; $$('[data-hz-pre]').forEach(b => b.classList.toggle('on', b === t)); return; }

      const isNew = draft.isNew; delete draft.isNew; const i = bs.findIndex(x => x.id === draft.id); i < 0 ? bs.push(draft) : (bs[i] = draft); save(); closeSheet(); render(true); toast(isNew ? `${draft.name} gespeichert – gilt ab jetzt automatisch` : 'Gespeichert'); return; }

<script>
'use strict';
/* Schlafanker – Ton-Schicht: Im Ton „Locker (Bro)“ spricht die App überall mit einer Prise Sarkasmus.
   Muster: „Aber klar, … garantiert …“ und „Bestimmt hilft dir … Ganz sicher.“
   Nie gemein gegen dich – nur gegen Feed, Algorithmus & Ausreden. Bei schlechter Stimmung bleibt es nett. */
(function () {
  const bro = () => (S.settings.tone || 'bro') === 'bro';
  const last = {};
  const pick = (k, arr) => { let i = Math.floor(Math.random() * arr.length); if (arr.length > 1 && i === last[k]) i = (i + 1) % arr.length; last[k] = i; return arr[i]; };
  const RULES = [
    [/^Stark! Leg es weg/, () => pick('win', ['Stark. Der Algorithmus ist jetzt offiziell enttäuscht von dir. 🌙', 'Weggelegt. Dein Morgen-Ich schickt Grüße. 🌙', 'Respekt – das schaffen um diese Uhrzeit die wenigsten. 🌙', 'Handy weg. Instagram überlebt das. Du auch. 🌙'])],
    [/^5 Minuten – danach/, () => pick('five', ['5 Minuten. Aber klar, danach hörst du garantiert sofort auf. ⏳', 'Okay, 5 Minuten. Ich zähl mit. Und ich bin nachtragend. ⏳', '5 Minuten. Das hat noch nie jemand überzogen. Niemals. ⏳'])],
    [/^5 Minuten sind um/, () => pick('fiveEnd', ['5 Minuten sind um. Hat das Reel dein Leben verändert? Nein. Aber morgen bist du dafür schön verklatscht. 🌙', 'Zeit ist um. Leg es weg, bevor dein Wecker es persönlich nimmt. 🌙', 'Das waren deine 5 Minuten. Morgen-Du hat gerade laut geseufzt. 🌙'])],
    [/^Gute Nacht 🌙 Wecker: (.*)$/, m => pick('gn', [`Gute Nacht 🌙 Wecker: ${m[1]}. Bestimmt schaust du jetzt nicht nochmal aufs Handy. Ganz sicher.`, `Gute Nacht 🌙 Wecker ${m[1]}. Das Handy bleibt jetzt liegen – auch wenn es vibriert.`, `Schlaf gut 🌙 ${m[1]} klingelt's. Bis dahin: nix mehr scrollen.`])],
    [/^Gute Nacht, Handy/, () => 'Gute Nacht, Handy 🌙 Es wird dich vermissen. Vielleicht.'],
    [/^Fokus läuft/, () => pick('foc', ['Fokus läuft. Bestimmt hilft dir ein kurzer Blick auf Insta dabei. Ganz sicher. 💪', 'Fokus an. Die Welt dreht sich auch ohne deinen Feed weiter. 💪', 'Los geht’s. Handy umdrehen – es guckt sonst so. 💪'])],
    [/^Abgebrochen – nächstes Mal/, () => pick('abb', ['Abgebrochen. Aber klar, nächstes Mal ziehst du es garantiert durch. 💙', 'Abgebrochen. Passiert. Nur nicht jedes Mal, okay? 💙', 'Und weg war der Fokus. Nächster Versuch? 💙'])],
    [/^Fokus geschafft! (.*)$/, m => `Fokus geschafft! ${m[1]} Wer hätte das gedacht.`],
    [/^Stark\. Jetzt raus ins Licht/, () => 'Wach. Respekt. Jetzt raus ins Licht – das Bett hatte genug von dir. ☀️'],
    [/^Läuft bei dir/, () => 'Läuft bei dir. Garantiert wegen dem ganzen Schlaf. 😄'],
    [/^Schön 🙂$/, () => 'Schön 🙂 Bestimmt hilft dir Schlaf dabei, das zu halten. Ganz sicher.'],
    [/^(.*) gespeichert – gilt ab jetzt automatisch$/, m => `${m[1]} gespeichert. Aber klar, du hältst dich garantiert dran. 😉`],
    [/^Challenge geschafft: (.*)$/, m => `Challenge geschafft: ${m[1]} Der Feed vermisst dich schon.`],
    [/^(\S+ \d+ Tage .*!.*)$/, m => `${m[1]} Der Algorithmus weint leise.`],
    [/^Wecker klingelt in 5 Sekunden/, () => 'Wecker klingelt in 5 Sekunden. Tu überrascht.'],
    [/^Geparkt bis (.*)\. Dein Kopf darf jetzt ruhen/, m => `Geparkt bis ${m[1]}. Bestimmt hilft dir Grübeln jetzt nicht weiter. Ganz sicher. 🌙`],
    [/^Dein Baum ist gewachsen · (.*)$/, m => `Dein Baum ist gewachsen · ${m[1]}. Bestimmt wächst er beim Scrollen noch schneller. Ganz sicher.`],
    [/^Neuer Baum in deinem Wald · (.*)$/, m => `Neuer Baum im Wald · ${m[1]}. Aber klar, der Feed hätte dir garantiert auch einen geschenkt.`],
    [/^Ganzer Wald\. Peace/, () => 'Ganzer Wald. Peace. 🌙 Der Algorithmus sucht dich jetzt garantiert im Unterholz.'],
    [/^Anker: (\S+) · morgen (\S+)$/, m => `Anker ${m[1]} · morgen ${m[2]}. Aber klar, du stehst garantiert sofort auf.`]
  ];
  const _toast = window.toast;
  window.toast = function (t) {
    if (bro() && typeof t === 'string') for (const [re, f] of RULES) { const m = t.match(re); if (m) { t = f(m); break; } }
    return _toast(t);
  };

  /* Knöpfe & Texte in Vollbild-Ansichten (Atempause, Wecker) im Bro-Ton */
  const SWAP = [
    ['Nur 5 Minuten', 'Nur 5 Minuten (sagt jeder)'],
    ['Ja, ich bin wach', 'Ja, ich bin wach. Wirklich.'],
    ['Ein Tipp genügt – sonst klingelt es erneut.', 'Ein Tipp genügt. Oder du tust weiter so, als ob – dann klingelt es eben nochmal.']
  ];
  function swapTexts(root) {
    if (!bro() || !root) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
    while ((n = w.nextNode())) { const v = n.nodeValue.trim(); for (const [a, b] of SWAP) if (v === a) n.nodeValue = n.nodeValue.replace(a, b); }
  }
  const al = document.getElementById('alarm');
  if (al) new MutationObserver(() => swapTexts(al)).observe(al, { childList: true, subtree: true });
})();

</script>

<script>
'use strict';
/* Offline – Serien direkt erledigen: Im Serien-Fenster hat jede Serie einen Knopf.
   ⏰ Bin jetzt wach → Aufstehzeit = jetzt · 🌙 Jetzt schlafen → Schlafmodus · 📵 Heute handyfrei → Silence startet
   und der Abend wird morgen automatisch mit 0 Min Handy eingetragen · 📓 Check-in → Assistent. */
(function () {
  const loc = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const morningKey = () => { const d = new Date(); if (d.getHours() >= 12) d.setDate(d.getDate() + 1); return loc(d); };
  const RS = () => (S.ruhe = S.ruhe || {});
  const hasToday = () => S.nights.find(n => n.date === todayKey());

  const ACT = {
    wake: () => ({ l: 'Bin wach', on: hasToday() && S.wakeNow?.date === todayKey() }),
    bed: () => ({ l: S.session ? 'Schläft ✓' : 'Schlafen', on: !!S.session }),
    phone: () => ({ l: RS().pfNight === morningKey() ? 'Läuft ✓' : 'Handyfrei', on: RS().pfNight === morningKey() }),
    log: () => ({ l: hasToday() ? 'Erledigt ✓' : 'Eintragen', on: !!hasToday() })
  };
  const KEYS = ['wake', 'bed', 'phone', 'log'];

  /* Knöpfe in die Serien-Zeilen setzen */
  const _sc = window.streakCard;
  window.streakCard = function () {
    const html = _sc.apply(this, arguments);
    if (window.__stSheet) {
      const parts = window.__stSheet.split('<div class="st-row');
      window.__stSheet = parts.map((p, i) => {
        if (i === 0) return p; const k = KEYS[i - 1], a = ACT[k] && ACT[k]();
        if (!a) return '<div class="st-row' + p;
        return '<div class="st-row' + p.replace('<div class="st-goal"', `<button class="st-do ${a.on ? 'ok' : ''}" data-stdo="${k}" ${a.on ? 'aria-disabled="true"' : ''}>${a.l}</button><div class="st-goal"`);
      }).join('');
    }
    return html;
  };

  /* Check-in vorausfüllen: Aufstehzeit „jetzt“ bzw. handyfreier Abend = 0 Min */
  const _wz = window.wizard;
  window.wizard = function () {
    _wz.apply(this, arguments);
    try {
      if (S.wakeNow?.date === todayKey()) { W.n.out = W.orig.out = S.wakeNow.t; }
      if (RS().pfNight === todayKey()) { W.n.phoneMin = 0; W.n.screen = false; }
    } catch (e) { }
  };
  /* Falls der Eintrag schon existiert: handyfreien Abend direkt nachtragen */
  function applyPending() {
    const k = RS().pfNight, n = k && S.nights.find(x => x.date === k);
    if (n && (n.phoneMin == null || n.phoneMin > 0)) { n.phoneMin = 0; n.screen = false; save(); }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-stdo]'); if (!t) return; e.stopPropagation();
    if (t.getAttribute('aria-disabled') === 'true') { try { buzz(6); } catch (x) { } return; }
    const k = t.dataset.stdo; try { buzz([10, 30, 10]); } catch (x) { }
    if (k === 'wake') {
      S.wakeNow = { date: todayKey(), t: nowHM() };
      const n = hasToday(); if (n) { n.out = n.wake = S.wakeNow.t; save(); closeSheet(); render(true); toast(`Aufgestanden um ${S.wakeNow.t} – eingetragen ✓`); }
      else { save(); closeSheet(); setTimeout(() => { wizard(); }, 260); toast(`Aufgestanden um ${S.wakeNow.t} – kurz noch die Nacht eintragen`); }
      return;
    }
    if (k === 'bed') { closeSheet(); setTimeout(() => goSleep(), 260); return; }
    if (k === 'phone') {
      RS().pfNight = morningKey(); applyPending(); save(); closeSheet();
      setTimeout(() => { if (window.SIL && SIL.start) { tab = 'ruhe'; render(); SIL.start(); } }, 300);
      toast('Handyfreier Abend läuft – wird morgen automatisch mit 0 Min eingetragen 📵');
      return;
    }
    if (k === 'log') { closeSheet(); setTimeout(() => { hasToday() ? checkinSheet(todayKey()) : wizard(); }, 260); }
  }, true);

  // Beim Speichern eines Check-ins: offenen handyfreien Abend übernehmen
  const _ws = window.wizSave;
  if (typeof _ws === 'function') window.wizSave = function () { _ws.apply(this, arguments); applyPending(); };
})();

<script>
'use strict';
/* Offline – Schlaf-Score nach dem Prinzip von Schlaf-Trackern wie Whoop (eigene Gestaltung):
   Score in % aus Schlafleistung (Stunden vs. Bedarf), Konsistenz (gleiche Zeiten) und Effizienz,
   Farbzonen, Schlafschuld und „Heute Nacht brauchst du …“. Tippen auf den Score öffnet die Details. */
(function () {
  const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const sd = a => { const m = avg(a); return Math.sqrt(avg(a.map(v => (v - m) ** 2))); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  window.scoreZone = s => s == null ? { k: 'none', l: '–', c: '#AEB8D6' } : s >= 85 ? { k: 'opt', l: 'Optimal', c: '#3ECF8E' } : s >= 70 ? { k: 'ok', l: 'Okay', c: '#F5C451' } : { k: 'low', l: 'Schwach', c: '#FF6B5E' };

  function metrics(ns) {
    if (!ns.length) return null; const need = S.settings.need * 60, c = ns.map(calc);
    const tst = avg(c.map(x => x.tst)), se = avg(c.map(x => x.se)), swing = (sd(ns.map(n => rel(toMin(n.bed)))) + sd(ns.map(n => rel(toMin(n.out))))) / 2;
    const perf = clamp(tst / need, 0, 1), cons = ns.length < 2 ? 1 : clamp(1 - swing / 90, 0, 1), eff = clamp((se - .65) / .3, 0, 1);
    const debt = c.reduce((a, x) => a + Math.max(0, need - x.tst), 0);
    return { tst, se, swing, perf, cons, eff, debt, score: Math.round(100 * (.5 * perf + .3 * cons + .2 * eff)) };
  }
  window.sleepMetrics = metrics;
  /* Schlaf-Score überall auf die neue Formel umstellen */
  const _stats = window.stats;
  window.stats = function (n = 7) { const r = _stats(n); if (r) { const m = metrics(lastN(n)); if (m) r.score = m.score; } return r; };

  /* Heute Nacht: Bedarf = Grundbedarf + Teil der Schlafschuld (max. 1,5 h) */
  function tonight(m) {
    const need = S.settings.need * 60, extra = Math.min(90, Math.round((m ? m.debt : 0) / 4 / 5) * 5), total = need + extra;
    const w = typeof wakeFor === 'function' ? wakeFor(tomorrow()).t : S.settings.wake;
    return { need, extra, total, wake: w, bed: fromMin(toMin(w) - total - 15) };
  }

  function open() {
    const all = sorted(), m = metrics(all.slice(-7)), prev = metrics(all.slice(-14, -7)), last = all[all.length - 1];
    if (!m) { openSheet(`<div class="ss"><h2>Noch kein Schlaf-Score</h2><p class="muted">Trag morgen früh deine erste Nacht ein – dann rechnet Offline los.</p><button class="btn full" data-act="close">Okay</button></div>`); return; }
    const bro = (S.settings.tone || 'bro') === 'bro', z = scoreZone(m.score), diff = prev ? m.score - prev.score : null, t = tonight(m);
    const lastPerf = last ? Math.round(clamp(calc(last).tst / (S.settings.need * 60), 0, 1) * 100) : null;
    const rows = [
      ['Schlafleistung', m.perf, `${dur(m.tst)} von ${dur(S.settings.need * 60)} Ø`],
      ['Konsistenz', m.cons, `Zeiten schwanken ±${Math.round(m.swing)} min`],
      ['Effizienz', m.eff, `${Math.round(m.se * 100)} % der Bettzeit geschlafen`]
    ];
    const weak = rows.slice().sort((a, b) => a[1] - b[1])[0][0];
    const quip = bro ? { Schlafleistung: 'Mehr schlafen. Bahnbrechende Erkenntnis, ich weiß.', Konsistenz: 'Jeden Tag gleich aufstehen. Ja, auch Samstag.', Effizienz: 'Weniger wach im Bett liegen. Also: Handy weg.' }[weak]
      : { Schlafleistung: 'Früher ins Bett – dein Fenster beginnt mit der Abendroutine.', Konsistenz: 'Feste Aufstehzeit, auch am Wochenende.', Effizienz: 'Erst müde ins Bett; nach 20 min wach kurz aufstehen.' }[weak];
    const C = 2 * Math.PI * 56;
    openSheet(`<div class="ss" style="--z:${z.c}">
      <div class="ss-ring"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="56" class="bg"/><circle cx="70" cy="70" r="56" class="fg" style="--c:${C};--o:${C * (1 - m.score / 100)}"/></svg>
        <div><b><span data-ss="${m.score}">0</span><i>%</i></b><small>Schlaf-Score</small></div></div>
      <p class="ss-zone"><span>${z.l}</span>${diff != null ? `<em class="${diff >= 0 ? 'up' : 'down'}">${diff >= 0 ? '▲' : '▼'} ${Math.abs(diff)} zur Vorwoche</em>` : ''}</p>
      ${lastPerf != null ? `<p class="ss-last">Letzte Nacht: <b>${dur(calc(last).tst)}</b> · ${lastPerf} % deines Bedarfs</p>` : ''}
      <div class="ss-bars">${rows.map(([l, v, sub], i) => `<div class="ss-row" style="--d:${.25 + i * .12}s;--zc:${scoreZone(Math.round(v * 100)).c}"><span>${l}<small>${sub}</small></span><i><u style="--w:${v * 100}%"></u></i><b><span data-ss="${Math.round(v * 100)}">0</span>%</b></div>`).join('')}</div>
      <div class="ss-need" style="--d:.65s"><div class="ss-need-top"><span>Heute Nacht brauchst du</span><b>${dur(t.total)}</b></div>
        <div class="ss-need-bar"><i style="--w:${t.need / t.total * 100}%"></i><u style="--w:${t.extra / t.total * 100}%"></u></div>
        <div class="ss-need-leg"><span><i></i>Grundbedarf ${dur(t.need)}</span>${t.extra ? `<span><u></u>Schlafschuld +${t.extra < 60 ? t.extra + ' min' : dur(t.extra)}</span>` : '<span>keine Schlafschuld</span>'}</div>
        <p>Für ${t.wake} → <b>ins Bett um ${t.bed}</b></p></div>
      <div class="ss-tip" style="--d:.8s"><strong>Größter Hebel: ${weak}</strong><span>${quip}</span></div>
      <button class="btn full" data-act="close" style="margin-top:14px">Alles klar</button></div>`);
    const t0 = performance.now(), els = [...document.querySelectorAll('[data-ss]')], d0 = RM() ? 1 : 900;
    (function step(tt) { const k = Math.min(1, (tt - t0) / d0), e = 1 - Math.pow(1 - k, 3); els.forEach(el => el.textContent = Math.round(Number(el.dataset.ss) * e)); if (k < 1) requestAnimationFrame(step); })(t0);
    try { buzz([8, 30, 8]); } catch (e) { }
  }

  /* Startseite: Score als kompakter Glas-Chip unter der Begrüßung (keine Kugel mehr, die Sonne bleibt) */
  if (window.Orb) { const _m = Orb.mount, _u = Orb.update; Orb.mount = (el, d) => _m(el, Object.assign({}, d, { scoreY: 0 })); Orb.update = d => _u(d && 'scoreY' in d ? Object.assign({}, d, { scoreY: 0 }) : d); }
  function chip() {
    const m = metrics(sorted().slice(-7)), C = 2 * Math.PI * 21;
    if (!m) return `<button class="sc-dot none" data-sc-open aria-label="Schlaf-Score – noch keine Nacht"><b>–</b></button>`;
    const z = scoreZone(m.score);
    return `<button class="sc-dot" data-sc-open style="--z:${z.c}" aria-label="Schlaf-Score ${m.score} Prozent, ${z.l}. Details öffnen">
      <svg viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="21" class="bg"/><circle cx="25" cy="25" r="21" class="fg" style="--c:${C.toFixed(1)};--o:${(C * (1 - m.score / 100)).toFixed(1)}"/></svg><b>${m.score}</b></button>`;
  }
  const _vh = window.vHeute;
  window.vHeute = function () { const h = _vh.apply(this, arguments), i = h.indexOf('</div>'); return i < 0 ? h : (h.slice(0, i) + chip() + h.slice(i)).replace('class="greet"', 'class="greet has-sc"'); };
  /* Öffnen: das Blatt wächst als Kreis aus dem Score-Punkt heraus */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-sc-open]'); if (!b) return;
    const r = b.getBoundingClientRect(); b.classList.add('tap'); setTimeout(() => b.classList.remove('tap'), 400);
    open(); const d = document.getElementById('sheet'); if (RM() || !d.open) return;
    if (!d.animate) return;
    d.getAnimations && d.getAnimations().forEach(an => an.cancel()); d.classList.add('ss-done');
    const sr = d.getBoundingClientRect(), ox = r.left + r.width / 2 - sr.left, oy = r.top + r.height / 2 - sr.top;
    const R = Math.max(...[[0, 0], [sr.width, 0], [0, sr.height], [sr.width, sr.height]].map(([x, y]) => Math.hypot(x - ox, y - oy))) + 4;
    const an = d.animate([{ clipPath: `circle(${r.width / 2}px at ${ox}px ${oy}px)`, opacity: .7 }, { clipPath: `circle(${R * .55}px at ${ox}px ${oy}px)`, opacity: 1, offset: .45 }, { clipPath: `circle(${R}px at ${ox}px ${oy}px)`, opacity: 1 }],
      { duration: 620, easing: 'cubic-bezier(.45,.05,.25,1)' });
    an.onfinish = an.oncancel = () => { d.style.clipPath = ''; };
  });
  const _cs = window.closeSheet; window.closeSheet = function () { document.getElementById('sheet').classList.remove('ss-morph', 'ss-done'); return _cs.apply(this, arguments); };
  addEventListener('sa-score', open);
  window.openScoreStats = open;
})();

<script>
'use strict';
/* Offline – „Dein Muster“: persönliche Schlafanalyse aus den eigenen Nächten.
   Bewusst knapp: Karte im Verlauf = Körperuhr + die 2 stärksten Zusammenhänge. Tippen → Details.
   Alles wird lokal berechnet (Gruppenvergleiche der eigenen Nächte, keine Annahmen von außen). */
(function () {
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const bro = () => (S.settings.tone || 'bro') === 'bro';
  const WDL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const wd = n => new Date(n.date + 'T12:00').getDay();
  const free = n => { const d = wd(n); return d === 6 || d === 0; }; // Nacht auf Sa / So
  const mid = n => { const b = rel(toMin(n.bed)), o = rel(toMin(n.out)); return (b + ((o - b + 1440) % 1440) / 2) % 1440; };
  const clock = r => fromMin((r + 18 * 60) % 1440);
  const durS = m => dur(Math.round(Math.abs(m) / 5) * 5);

  /* Vergleich zweier Gruppen: nur wenn beide genug Nächte haben und der Unterschied spürbar ist */
  function cmp(ns, test, minN = 2) {
    const a = ns.filter(test), b = ns.filter(n => !test(n)); if (a.length < minN || b.length < minN) return null;
    const ta = avg(a.map(n => calc(n).tst)), tb = avg(b.map(n => calc(n).tst)); return { ta, tb, d: ta - tb, na: a.length, nb: b.length };
  }

  function analyse() {
    const ns = sorted().slice(-42); if (ns.length < 4) return null;
    const need = S.settings.need * 60, B = bro(), F = [];
    // 1) Handy am Abend / im Bett
    const ph = cmp(ns, n => (n.phoneMin != null ? n.phoneMin >= 30 : !!n.screen));
    if (ph && ph.d < -20) F.push({ k: 'phone', ic: '📱', w: -ph.d, a: ['Mit Handy', ph.ta], b: ['Ohne', ph.tb],
      t: B ? `Mit Handy im Bett schläfst du <b>${durS(ph.d)} weniger</b>. Jede Nacht. Der Feed ist es nicht wert.` : `Mit Handy im Bett schläfst du im Schnitt <b>${durS(ph.d)} weniger</b>.` });
    // 2) Koffein nach 14 Uhr
    const cf = cmp(ns, n => !!n.caffeine);
    if (cf && cf.d < -20) F.push({ k: 'coffee', ic: '☕', w: -cf.d, a: ['Mit Koffein', cf.ta], b: ['Ohne', cf.tb],
      t: B ? `Nachmittags-Kaffee kostet dich <b>${durS(cf.d)} Schlaf</b>. Teuerster Kaffee deines Lebens.` : `Mit Koffein nach 14 Uhr schläfst du <b>${durS(cf.d)} weniger</b>.` });
    // 3) Früh vs. spät ins Bett (Schwelle = dein eigener Median)
    const bs = ns.map(n => rel(toMin(n.bed))).sort((x, y) => x - y), med = bs[Math.floor(bs.length / 2)], cut = Math.ceil(med / 15) * 15;
    const bd = cmp(ns, n => rel(toMin(n.bed)) < cut);
    if (bd && bd.d > 20) F.push({ k: 'bed', ic: '🌙', w: bd.d, a: [`Vor ${clock(cut)}`, bd.ta], b: ['Später', bd.tb],
      t: B ? `Vor ${clock(cut)} im Bett = <b>${durS(bd.d)} mehr Schlaf</b>. Die Uni fängt nämlich nicht später an, nur weil du später pennst.` : `Wenn du vor ${clock(cut)} im Bett bist, schläfst du <b>${durS(bd.d)} länger</b>.` });
    // 4) Sozialer Jetlag: Schlafmitte Wochenende vs. Woche
    const fr = ns.filter(free), wk = ns.filter(n => !free(n)); let jet = null;
    if (fr.length >= 2 && wk.length >= 2) { jet = avg(fr.map(mid)) - avg(wk.map(mid)); if (Math.abs(jet) >= 45) F.push({ k: 'jet', ic: '✈️', w: Math.abs(jet) * .8,
      t: B ? `Am Wochenende verschiebt sich deine Körperuhr um <b>${durS(jet)}</b>. Das ist Jetlag – nur ohne Urlaub.` : `Am Wochenende verschiebt sich deine Schlafmitte um <b>${durS(jet)}</b> (sozialer Jetlag). Montags fühlt sich das wie Zeitverschiebung an.` }); }
    // 5) Schwächster Wochentag (mind. 2 Nächte)
    const by = {}; ns.forEach(n => { (by[wd(n)] = by[wd(n)] || []).push(calc(n).tst); });
    const days = Object.entries(by).filter(([, v]) => v.length >= 2).map(([d, v]) => [Number(d), avg(v)]);
    if (days.length >= 3) { const all = avg(ns.map(n => calc(n).tst)), w = days.reduce((a, b) => b[1] < a[1] ? b : a); const nightOf = WDL[(w[0] + 6) % 7];
      if (all - w[1] > 30) F.push({ k: 'day', ic: '📅', w: (all - w[1]) * .9, t: B ? `Die Nacht auf ${WDL[w[0]]} ist dein Endgegner: nur <b>${dur(Math.round(w[1]))}</b>. ${nightOf}abend früher Schluss machen.` : `In der Nacht auf ${WDL[w[0]]} schläfst du am wenigsten (<b>${dur(Math.round(w[1]))}</b>). Plane ${nightOf}abend bewusst früher.` }); }
    // 6) Deine besten Nächte
    const good = ns.filter(n => (n.q || 0) >= 4);
    if (good.length >= 2) { const gb = avg(good.map(n => rel(toMin(n.bed)))), gt = avg(good.map(n => calc(n).tst));
      F.push({ k: 'best', ic: '⭐', w: 15, t: B ? `Deine besten Nächte starten um <b>${clock(Math.round(gb / 5) * 5)}</b> und gehen ${dur(Math.round(gt))}. Du weißt also, wie's geht.` : `Deine besten Nächte beginnen im Schnitt um <b>${clock(Math.round(gb / 5) * 5)}</b> und dauern ${dur(Math.round(gt))}.` }); }
    F.sort((a, b) => b.w - a.w);
    // Körperuhr (Chronotyp): Schlafmitte an freien Tagen, sonst alle Nächte
    const base = fr.length >= 2 ? fr : ns, msf = avg(base.map(mid)), ms = clock(Math.round(msf / 5) * 5), msH = (msf + 18 * 60) % 1440 / 60;
    const type = msH < 3.5 || msH > 15 ? ['Lerche', '🐦'] : msH < 5 ? ['Mittel-Typ', '🕊️'] : ['Eule', '🦉'];
    const ideal = fromMin(Math.round(((msf + 18 * 60) - need / 2 + 1440) % 1440 / 5) * 5);
    const debt = Math.max(0, need - avg(ns.slice(-7).map(n => calc(n).tst)));
    return { F, type, ms, ideal, free: fr.length >= 2, jet, n: ns.length, debt, need };
  }
  window.sleepPattern = analyse;

  const typeLine = A => bro()
    ? `Dein Körper will um <b>${A.ideal}</b> pennen. ${typeof wakeFor === 'function' && toMin(wakeFor(tomorrow()).t) < 8 * 60 + 1 && A.type[0] === 'Eule' ? 'Die Uni will dich früher. Rate mal, wer gewinnt.' : 'Hör öfter auf ihn.'}`
    : `Natürliche Einschlafzeit etwa <b>${A.ideal}</b>.`;

  function card() {
    const A = analyse();
    if (!A) return `<div class="card mu mu-wait"><div class="mu-top"><i>🧬</i><div><small>Dein Muster</small><p>Ab 4 Nächten erkennt Offline, was <b>deinen</b> Schlaf kaputt macht.</p></div></div></div>`;
    const top = A.F.slice(0, 2);
    return `<button class="card mu" data-mu-open>
      <div class="mu-top"><i>${A.type[1]}</i><div><small>Dein Muster · ${A.type[0]}</small><p>${typeLine(A)}</p></div><svg class="mu-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></div>
      ${top.length ? `<ul class="mu-list">${top.map((f, i) => `<li style="--d:${.08 + i * .08}s"><span>${f.ic}</span><p>${f.t}</p></li>`).join('')}</ul>` : `<p class="mu-none">Noch keine klaren Muster – ${A.n} Nächte, weiter eintragen.</p>`}
    </button>`;
  }

  function sheet() {
    const A = analyse(); if (!A) return;
    const mx = Math.max(A.need, ...A.F.filter(f => f.a).flatMap(f => [f.a[1], f.b[1]]));
    const bars = f => f.a ? `<div class="mu-cmp">${[f.a, f.b].map(([l, v], j) => `<div><span>${l}</span><i><u class="${v >= Math.max(f.a[1], f.b[1]) ? 'b' : 'a'}" style="--w:${(v / mx * 100).toFixed(1)}%"></u></i><b>${dur(Math.round(v))}</b></div>`).join('')}</div>` : '';
    openSheet(`<div class="mu-sh"><h2>Dein Muster</h2><p class="muted">Aus deinen letzten ${A.n} Nächten – nur deine Daten, kein Durchschnittsmensch.</p>
      <div class="mu-clock"><div class="mu-type"><i>${A.type[1]}</i><b>${A.type[0]}</b></div>
        <dl><div><dt>Schlafmitte${A.free ? ' (Wochenende)' : ''}</dt><dd>${A.ms}</dd></div><div><dt>Natürlich müde</dt><dd>${A.ideal}</dd></div>${A.jet != null ? `<div><dt>Wochenend-Jetlag</dt><dd>${Math.abs(A.jet) < 15 ? 'keiner' : (A.jet > 0 ? '+' : '−') + durS(A.jet)}</dd></div>` : ''}<div><dt>Schlafschuld / Nacht</dt><dd>${A.debt < 10 ? 'keine' : durS(A.debt)}</dd></div></dl></div>
      ${A.F.length ? `<div class="mu-fs">${A.F.slice(0, 5).map((f, i) => `<div class="mu-f" style="--d:${.1 + i * .07}s"><p><span>${f.ic}</span>${f.t}</p>${bars(f)}</div>`).join('')}</div>` : '<p class="muted">Noch keine klaren Zusammenhänge. Trag weiter ein – und markier Handy/Koffein im Check-in, dann wird es spannend.</p>'}
      <p class="mu-foot">Vergleiche deiner eigenen Nächte, keine Diagnose. Je mehr Nächte, desto genauer.</p>
      <button class="btn full" data-act="close">Alles klar</button></div>`);
    try { buzz([8, 30, 8]); } catch (e) { }
  }
  window.openPattern = sheet;
  document.addEventListener('click', e => { if (e.target.closest('[data-mu-open]')) sheet(); });

  /* Im Verlauf: „Größter Hebel“-Karte durch „Dein Muster“ ersetzen (der Hebel steht weiter in den Score-Details) */
  const _vv = window.vVerlauf;
  window.vVerlauf = function () {
    const h = _vv.apply(this, arguments), i = h.indexOf('<div class="card vh">');
    if (i < 0) return S.nights.length ? h : h; const j = h.indexOf('</div></div>', i) + 12;
    return h.slice(0, i) + card() + h.slice(j);
  };
})();

</script>
